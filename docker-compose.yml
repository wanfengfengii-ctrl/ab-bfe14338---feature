services:
  web:
    build:
      context: .
      target: production
    image: pulse-timing-audit:latest
    ports:
      # 宿主机端口通过环境变量 HOST_PORT 配置，默认 8080
      - "${HOST_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

  # 一次性服务：代码（类型检查 + 算法裁决单测）、构建、HTTP 冒烟，
  # 自行退出并以退出码报告结果。运行方式：
  #   docker compose run --build verify
  verify:
    build:
      context: .
      target: verify
    image: pulse-timing-audit:verify
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: http://web:80
    restart: "no"
    command: ["sh", "scripts/verify.sh"]
