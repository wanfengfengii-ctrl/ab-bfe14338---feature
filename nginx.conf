server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compose 健康检查端点
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
